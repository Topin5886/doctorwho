# Mémoire allouée à Gradle (Loom décompile Minecraft : 2 Go minimum conseillés)
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Force Gradle à tourner sur Java 17 (Java 25, installé par défaut sur ce PC, est incompatible)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.101-hotspot

# --- Fabric (versions vérifiées sur https://fabricmc.net/develop) ---
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.17.2
fabric_version=0.92.6+1.20.1

# --- Mod ---
mod_version=0.1.0
maven_group=fr.doctorwho
archives_base_name=doctorwho

# --- Dépendances ---
# GeckoLib 4 (modèles Blockbench + animations) : https://modrinth.com/mod/geckolib
geckolib_version=4.8.4
# Librairie Molang utilisée par GeckoLib (anciennement écrite « eliotlassiter » par erreur)
mclib_version=20

# --- Profil CurseForge « david mod » : le .jar y est copié après chaque « build » ---
# (supprime cette ligne pour désactiver la copie automatique)
curseforge_mods_dir=C:/Users/jules/curseforge/minecraft/Instances/Fabulously Optimized/mods

# --- Tests de compatibilité en dev (désactivés par défaut) ---
# Passe à true pour lancer runClient avec Sodium + Iris et vérifier le rendu avec shaders.
# Note : « Oculus » est le portage Forge d'Iris ; sur Fabric, c'est Iris qu'on utilise.
test_with_sodium_iris=false
sodium_version=mc1.20.1-0.5.13-fabric
iris_version=1.7.6+1.20.1
